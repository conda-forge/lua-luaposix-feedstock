schema_version: 1

context:
  name: lua-luaposix
  version: "37.0"

package:
  name: ${{ name }}
  version: ${{ version }}

source:
  url: https://github.com/luaposix/luaposix/archive/v${{ version }}.tar.gz
  sha256: 3a0cf9fc9459ae0975afd1e24ea552decfcda2231651a0d3bd6e1f075e089e01

build:
  number: 0
  skip: win
  dynamic_linking:
    rpaths:
      - lib/lua/5.4/
      - lib/

requirements:
  build:
    - ${{ compiler('c') }}
    - ${{ stdlib("c") }}
  host:
    - zlib
    - luarocks
    - lua
    - perl
  run:
    - lua
    - luarocks

tests:
  - script:
      - lua -e "require 'posix'"

about:
  license: MIT
  license_file: LICENSE
  summary: This is a POSIX binding for LuaJIT, Lua 5.1, 5.2 and 5.3
  description: |
    This is a POSIX binding for LuaJIT, Lua 5.1, 5.2, 5.3 and 5.4; like most libraries
    it simply binds to C APIs on the underlying system, so it won't work on
    non-POSIX systems. However, it does try to detect the level of POSIX
    conformance of the underlying system and bind only available APIs.


  homepage: http://luaposix.github.io/luaposix/

extra:
  recipe-maintainers:
    - jerowe
    - izahn
    - jan-janssen
